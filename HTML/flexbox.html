<html><head>
    <title>Flexbox Example</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }
        .item {
            flex: 1;
            margin: 10px;
            padding: 20px;
            background-color: lightgray;
        }
        .card {
            width: 180px;
            padding: 20px;
            background-color: lightblue;
            border: 2px solid #ccc;
            text-align: center;
        }
    </style>
</head><body>
    <h1>ABC College Department</h1>
    <div class="container">
        <div class="card">
            <h2>CSE</h2>
            <p>Welcome to Department 1</p>
        </div>
        <div class="card">
            <h2>ECE</h2>
            <p>Welcome to Department 2</p>
        </div>
        <div class="card">
            <h2>CSIT</h2>
            <p>Welcome to Department 3</p>
        </div>
</body>
</html>
